# ==============================================================================
# NEXUS — Zero-Cost Local Operations Docker Compose Stack
#
# Budget: ₹0 / month. Absolutely no cloud provisioning, paid services, or external APIs.
# Runs the entire three-pillar NEXUS platform (Intelligence, Retention, Pulse)
# on the operator's local computer.
#
# Stack Components:
#   1. postgres:  PostgreSQL 16 + pgvector (reuses existing persistent data volume)
#   2. redis:     Redis 7.x in-memory cache & rate limiter with AOF persistence
#   3. mailpit:   Zero-cost local SMTP & web mailbox inspector (1025 SMTP / 8025 Web UI)
#   4. backend:   FastAPI application server (Port 8000)
#   5. scheduler: Dedicated Continuous Intelligence & Pulse report automated worker
#   6. frontend:  React SPA production bundle via Nginx reverse proxy (Port 3000)
#
# Usage:
#   Start full stack:     docker compose -f docker-compose.local.yml up -d
#   Start backing only:   docker compose -f docker-compose.local.yml up -d postgres redis mailpit
#   Stop stack:           docker compose -f docker-compose.local.yml down
# ==============================================================================

name: nexus-local

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector extension (Zero Cost)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres_local
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_staging_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-nexus_staging_db}
    volumes:
      - nexus_postgres_staging_data:/var/lib/postgresql/data
      - ./infra/staging/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_staging_user} -d ${POSTGRES_DB:-nexus_staging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-local-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache & Token Revocation Store (Zero Cost)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexus_redis_local
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - nexus_redis_staging_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexus-local-network

  # ----------------------------------------------------------------------------
  # 3. Mailpit Local SMTP Server & Web Mailbox Inspector (Zero Cost)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: nexus_mailpit_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # Standard SMTP listening port
      - "127.0.0.1:8025:8025"   # Zero-Cost Web UI for inspecting emails & PDF reports
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: ""          # In-memory storage for disposable local testing
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nexus-local-network

  # ----------------------------------------------------------------------------
  # 4. NEXUS Backend API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: nexus_backend_local
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      - "DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nexus_staging_user}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in .env}@postgres:5432/${POSTGRES_DB:-nexus_staging_db}"
      - REDIS_URL=redis://redis:6379/0
      - REDIS_FAIL_CLOSED=true
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - USE_MAILPIT=true
      - PULSE_FROM_EMAIL=pulse@nexus.local
      - APP_ENV=development
      - DEBUG=false
      - LOG_LEVEL=INFO
      - REQUIRE_POSTGRES=true
      - LLM_ALLOW_EXTERNAL_CALLS=false
      - DEFAULT_LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - NEXUS_KMS_PROVIDER=local
      - NEXUS_DEV_KMS_MASTER_KEY=${NEXUS_DEV_KMS_MASTER_KEY:-}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - "SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY must be configured in .env}"
      - "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?Error: AUTH_JWT_SECRET must be configured in .env}"
      - CONTINUOUS_SCHEDULER_AUTOSTART=false
      - WEB_CONCURRENCY=2
      - DATA_UPLOAD_MAX_MEMORY_SIZE_MB=50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
    networks:
      - nexus-local-network

  # ----------------------------------------------------------------------------
  # 5. NEXUS Continuous Intelligence & Pulse Report Scheduler Worker
  # ----------------------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: nexus_scheduler_local
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "-m", "app.scheduler_runner"]
    environment:
      - "DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nexus_staging_user}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in .env}@postgres:5432/${POSTGRES_DB:-nexus_staging_db}"
      - REDIS_URL=redis://redis:6379/0
      - REDIS_FAIL_CLOSED=true
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - USE_MAILPIT=true
      - PULSE_FROM_EMAIL=pulse@nexus.local
      - APP_ENV=development
      - DEBUG=false
      - LOG_LEVEL=INFO
      - REQUIRE_POSTGRES=true
      - LLM_ALLOW_EXTERNAL_CALLS=false
      - DEFAULT_LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - NEXUS_KMS_PROVIDER=local
      - NEXUS_DEV_KMS_MASTER_KEY=${NEXUS_DEV_KMS_MASTER_KEY:-}
      - CONTINUOUS_SCHEDULER_ENABLED=true
      - CONTINUOUS_SCHEDULER_AUTOSTART=false
      - CONTINUOUS_SCHEDULER_INTERVAL_SECONDS=60
      - "SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY must be configured in .env}"
      - "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?Error: AUTH_JWT_SECRET must be configured in .env}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - nexus-local-network

  # ----------------------------------------------------------------------------
  # 6. NEXUS Frontend (React SPA via Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: nexus_frontend_local
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nexus-local-network

volumes:
  nexus_postgres_staging_data:
    external: true
  nexus_redis_staging_data:
    external: true

networks:
  nexus-local-network:
    name: nexus-local-network
    driver: bridge
