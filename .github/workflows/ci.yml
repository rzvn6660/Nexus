name: NEXUS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Test Suite & Smoke Verification (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_password
          POSTGRES_DB: nexus_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run PostgreSQL database migrations
        env:
          DATABASE_URL: postgresql+psycopg://nexus_user:nexus_password@localhost:5432/nexus_test_db
        run: |
          cd backend
          python -c "import os; from sqlalchemy import create_engine, text; e = create_engine(os.environ['DATABASE_URL']); conn = e.connect(); conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector;')); conn.commit(); conn.close()"
          alembic upgrade head

      - name: Run PostgreSQL integration tests (Phase 30 live pgvector & Phase 33 business acceptance)
        if: success() || failure()
        env:
          DATABASE_URL: postgresql+psycopg://nexus_user:nexus_password@localhost:5432/nexus_test_db
          TEST_DATABASE_URL: postgresql+psycopg://nexus_user:nexus_password@localhost:5432/nexus_test_db
          APP_ENV: test
          DEBUG: "false"
          REQUIRE_POSTGRES: "true"
        run: |
          cd backend
          pytest tests/test_postgres_integration_phase30.py tests/test_e2e_business_acceptance_phase33.py -v -rA

      - name: Run backend tests
        if: success() || failure()
        env:
          DATABASE_URL: postgresql+psycopg://nexus_user:nexus_password@localhost:5432/nexus_test_db
          APP_ENV: test
          DEBUG: "false"
        run: |
          cd backend
          pytest --ignore=tests/test_postgres_integration_phase30.py --ignore=tests/test_e2e_business_acceptance_phase33.py

      - name: Run evaluation benchmark regression check
        run: |
          python -m evaluation.runner --all --compare-baseline

      - name: Run production smoke test
        env:
          DATABASE_URL: postgresql+psycopg://nexus_user:nexus_password@localhost:5432/nexus_test_db
          TEST_DATABASE_URL: postgresql+psycopg://nexus_user:nexus_password@localhost:5432/nexus_test_db
          REQUIRE_POSTGRES: "true"
          APP_ENV: test
        run: |
          python scripts/smoke_test.py --require-healthy

  frontend-build:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript typecheck
        run: |
          cd frontend
          npm run type-check

      - name: Run Vite build
        run: |
          cd frontend
          npm run build
