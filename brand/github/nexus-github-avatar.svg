<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="avatar-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>

    <linearGradient id="av-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="av-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="av-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <filter id="av-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="400" height="400" rx="80" fill="url(#avatar-bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Alignment Ring -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />

  <!-- Centered Nexus Symbol -->
  <g transform="translate(100, 80) scale(0.78125)">
    <!-- 256x256 scaled down to 200x200 -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <line x1="68" y1="64" x2="68" y2="192" stroke="url(#av-left)" stroke-width="20" />
      <line x1="188" y1="64" x2="188" y2="192" stroke="url(#av-right)" stroke-width="20" />
      <line x1="68" y1="64" x2="188" y2="192" stroke="url(#av-diag)" stroke-width="20" />
    </g>
    <circle cx="68" cy="64" r="9" fill="#38bdf8" />
    <circle cx="68" cy="192" r="9" fill="#0284c7" />
    <circle cx="188" cy="64" r="9" fill="#0284c7" />
    <circle cx="188" cy="192" r="9" fill="#4f46e5" />
    <polygon points="128,106 150,128 128,150 106,128" fill="#00f2fe" opacity="0.5" filter="url(#av-glow)" />
    <polygon points="128,112 144,128 128,144 112,128" fill="#ffffff" />
  </g>

  <!-- Clean Bottom Wordmark -->
  <text x="200" y="328" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="0.16em">NEXUS</text>
  <text x="200" y="352" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.26em">AGENTIC BI</text>
</svg>
