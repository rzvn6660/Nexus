<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="rb-glow-left" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0c2540" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rb-glow-right" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <!-- Symbol Trail Gradients -->
    <linearGradient id="rb-left-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="rb-diagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="rb-right-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Bloom filter -->
    <filter id="rb-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1280" height="480" rx="20" fill="#060911" />
  <rect width="1280" height="480" rx="20" fill="url(#rb-glow-left)" />
  <rect width="1280" height="480" rx="20" fill="url(#rb-glow-right)" />

  <!-- Outer Stroke -->
  <rect width="1278" height="478" x="1" y="1" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Precision Technical Background Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="880" y1="0" x2="880" y2="480" />
    <line x1="1040" y1="0" x2="1040" y2="480" />
    <line x1="1200" y1="0" x2="1200" y2="480" />

    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
  </g>

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
  <!-- Verification Badge -->
  <g transform="translate(90, 72)">
    <rect width="254" height="28" rx="14" fill="#0b172b" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="28" y="18" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.12em">PHASES 1–10 ENTERPRISE STABLE</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="175" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="0.08em">NEXUS</text>

  <!-- Category & Subtitle -->
  <text x="92" y="215" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="0.16em">AGENTIC BUSINESS INTELLIGENCE PLATFORM</text>

  <!-- Tagline Quote -->
  <text x="92" y="260" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" font-style="italic" fill="#38bdf8">"Where Business Data Becomes Intelligence."</text>

  <!-- Positioning Summary -->
  <text x="92" y="305" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#cbd5e1" opacity="0.85">Connecting deterministic SQL analytics, diagnostic causal decomposition, statistical</text>
  <text x="92" y="328" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#cbd5e1" opacity="0.85">forecasting, and LangGraph orchestration into an evidence-backed intelligence workflow.</text>

  <!-- Core Pipeline Sequence Badges -->
  <g transform="translate(92, 368)">
    <!-- Pill 1 -->
    <rect width="68" height="26" rx="6" fill="#1e293b" />
    <text x="34" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">DATA</text>
    <text x="82" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">→</text>

    <!-- Pill 2 -->
    <rect x="100" width="88" height="26" rx="6" fill="#1e293b" />
    <text x="144" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">CONTEXT</text>
    <text x="202" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">→</text>

    <!-- Pill 3 -->
    <rect x="220" width="94" height="26" rx="6" fill="#1e293b" />
    <text x="267" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">ANALYTICS</text>
    <text x="328" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">→</text>

    <!-- Pill 4 -->
    <rect x="346" width="108" height="26" rx="6" fill="#1e293b" />
    <text x="400" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">INVESTIGATE</text>
    <text x="468" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">→</text>

    <!-- Pill 5 -->
    <rect x="486" width="92" height="26" rx="6" fill="#1e293b" />
    <text x="532" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">FORECAST</text>
    <text x="592" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">→</text>

    <!-- Pill 6 -->
    <rect x="610" width="88" height="26" rx="6" fill="#0284c7" />
    <text x="654" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff">DECIDE</text>
  </g>

  <!-- ================= RIGHT COLUMN: VISUAL SYMBOL & BENCHMARK CARDS ================= -->
  <g transform="translate(860, 60)">
    <!-- Outer Focus Rings -->
    <circle cx="160" cy="160" r="150" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />
    <circle cx="160" cy="160" r="110" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.2" />

    <!-- NEXUS Symbol (256x256 scaled down to ~220x220 centered) -->
    <g transform="translate(45, 45) scale(0.9)">
      <g stroke-linecap="round" stroke-linejoin="round">
        <line x1="68" y1="64" x2="68" y2="192" stroke="url(#rb-left-rail)" stroke-width="22" />
        <line x1="188" y1="64" x2="188" y2="192" stroke="url(#rb-right-rail)" stroke-width="22" />
        <line x1="68" y1="64" x2="188" y2="192" stroke="url(#rb-diagonal)" stroke-width="22" />
      </g>
      <circle cx="68" cy="64" r="10" fill="#38bdf8" />
      <circle cx="68" cy="192" r="10" fill="#0284c7" />
      <circle cx="188" cy="64" r="10" fill="#0284c7" />
      <circle cx="188" cy="192" r="10" fill="#4f46e5" />
      <polygon points="128,104 154,128 128,152 102,128" fill="#00f2fe" opacity="0.6" filter="url(#rb-bloom)" />
      <polygon points="128,110 146,128 128,146 110,128" fill="#ffffff" />
    </g>

    <!-- Floating Metric Tag 1 (Top Left) -->
    <g transform="translate(-80, 50)">
      <rect width="140" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">HALLUCINATION</text>
      <text x="14" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#10b981">0.0% VERIFIED</text>
    </g>

    <!-- Floating Metric Tag 2 (Bottom Right) -->
    <g transform="translate(240, 240)">
      <rect width="148" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">BACKEND TESTS</text>
      <text x="14" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#38bdf8">191/191 PASS</text>
    </g>

    <!-- Floating Metric Tag 3 (Bottom Left) -->
    <g transform="translate(-40, 260)">
      <rect width="144" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">INJECTION DEFENSE</text>
      <text x="14" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#6366f1">100% BLOCKED</text>
    </g>
  </g>
</svg>
