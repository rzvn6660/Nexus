<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Light Trail Gradients -->
    <linearGradient id="nexus-left-rail-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="nexus-diagonal-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="nexus-right-rail-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="256" height="256" rx="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Subtle Alignment Circle -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 8" />

  <!-- Connecting Vector Pathways -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <line x1="68" y1="64" x2="68" y2="192" stroke="url(#nexus-left-rail-light)" stroke-width="18" />
    <line x1="188" y1="64" x2="188" y2="192" stroke="url(#nexus-right-rail-light)" stroke-width="18" />
    <line x1="68" y1="64" x2="188" y2="192" stroke="url(#nexus-diagonal-light)" stroke-width="18" />
  </g>

  <!-- Evidence Anchors -->
  <circle cx="68" cy="64" r="8" fill="#0284c7" />
  <circle cx="68" cy="192" r="8" fill="#0369a1" />
  <circle cx="188" cy="64" r="8" fill="#0369a1" />
  <circle cx="188" cy="192" r="8" fill="#4338ca" />

  <!-- Central Nexus Core -->
  <polygon points="128,106 150,128 128,150 106,128" fill="#0284c7" opacity="0.3" />
  <polygon points="128,112 144,128 128,144 112,128" fill="#0f172a" />
</svg>
