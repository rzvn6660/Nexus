<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <!-- Symbol Trail Gradients for Light Mode -->
    <linearGradient id="p-sym-left-lt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="p-sym-diag-lt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="p-sym-right-lt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Clean Background -->
  <rect width="560" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Standalone Symbol (72x72 box centered at x=64, y=60) -->
  <g transform="translate(24, 20) scale(0.3125)">
    <g stroke-linecap="round" stroke-linejoin="round">
      <line x1="68" y1="64" x2="68" y2="192" stroke="url(#p-sym-left-lt)" stroke-width="20" />
      <line x1="188" y1="64" x2="188" y2="192" stroke="url(#p-sym-right-lt)" stroke-width="20" />
      <line x1="68" y1="64" x2="188" y2="192" stroke="url(#p-sym-diag-lt)" stroke-width="20" />
    </g>
    <circle cx="68" cy="64" r="9" fill="#0284c7" />
    <circle cx="68" cy="192" r="9" fill="#0369a1" />
    <circle cx="188" cy="64" r="9" fill="#0369a1" />
    <circle cx="188" cy="192" r="9" fill="#4338ca" />
    <polygon points="128,106 150,128 128,150 106,128" fill="#0284c7" opacity="0.25" />
    <polygon points="128,112 144,128 128,144 112,128" fill="#0f172a" />
  </g>

  <!-- Subtle Vertical Divider -->
  <line x1="126" y1="36" x2="126" y2="84" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Wordmark & Subtitle -->
  <text x="150" y="65" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#0f172a" letter-spacing="0.12em">NEXUS</text>
  <text x="152" y="86" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569" letter-spacing="0.22em">AGENTIC BUSINESS INTELLIGENCE</text>
</svg>
