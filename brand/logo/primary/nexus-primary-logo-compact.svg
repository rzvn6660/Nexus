<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="compact-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Symbol Trail Gradients -->
    <linearGradient id="c-sym-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="c-sym-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="c-sym-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="320" height="320" rx="28" fill="url(#compact-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Centered Symbol (128x128 box centered at x=96, y=36) -->
  <g transform="translate(96, 32) scale(0.5)">
    <g stroke-linecap="round" stroke-linejoin="round">
      <line x1="68" y1="64" x2="68" y2="192" stroke="url(#c-sym-left)" stroke-width="20" />
      <line x1="188" y1="64" x2="188" y2="192" stroke="url(#c-sym-right)" stroke-width="20" />
      <line x1="68" y1="64" x2="188" y2="192" stroke="url(#c-sym-diag)" stroke-width="20" />
    </g>
    <circle cx="68" cy="64" r="9" fill="#38bdf8" />
    <circle cx="68" cy="192" r="9" fill="#0284c7" />
    <circle cx="188" cy="64" r="9" fill="#0284c7" />
    <circle cx="188" cy="192" r="9" fill="#4f46e5" />
    <polygon points="128,106 150,128 128,150 106,128" fill="#38bdf8" opacity="0.4" />
    <polygon points="128,112 144,128 128,144 112,128" fill="#ffffff" />
  </g>

  <!-- Typography Block (Centered) -->
  <text x="160" y="208" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="0.14em">NEXUS</text>
  <text x="160" y="234" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.24em">AGENTIC BUSINESS INTELLIGENCE</text>

  <!-- Divider -->
  <line x1="110" y1="254" x2="210" y2="254" stroke="#334155" stroke-width="1" stroke-linecap="round" />

  <!-- Tagline -->
  <text x="160" y="278" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#38bdf8">"Where Business Data Becomes Intelligence."</text>
</svg>
