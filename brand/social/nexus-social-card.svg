<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="sc-glow-center" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0e2338" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#070d18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#03060b" />
    </radialGradient>

    <!-- Symbol Trail Gradients -->
    <linearGradient id="sc-left-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sc-diagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="sc-right-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <filter id="sc-core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#sc-glow-center)" />
  <rect width="1198" height="628" x="1" y="1" rx="0" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Ambient Technical Rings -->
  <circle cx="600" cy="220" r="220" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.4" />
  <circle cx="600" cy="220" r="160" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.2" />

  <!-- Centered Nexus Symbol -->
  <g transform="translate(500, 120) scale(0.78125)">
    <!-- 256x256 scaled to 200x200 centered at (600, 220) -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <line x1="68" y1="64" x2="68" y2="192" stroke="url(#sc-left-rail)" stroke-width="22" />
      <line x1="188" y1="64" x2="188" y2="192" stroke="url(#sc-right-rail)" stroke-width="22" />
      <line x1="68" y1="64" x2="188" y2="192" stroke="url(#sc-diagonal)" stroke-width="22" />
    </g>
    <circle cx="68" cy="64" r="10" fill="#38bdf8" />
    <circle cx="68" cy="192" r="10" fill="#0284c7" />
    <circle cx="188" cy="64" r="10" fill="#0284c7" />
    <circle cx="188" cy="192" r="10" fill="#4f46e5" />
    <polygon points="128,104 154,128 128,152 102,128" fill="#00f2fe" opacity="0.5" filter="url(#sc-core-glow)" />
    <polygon points="128,110 146,128 128,146 110,128" fill="#ffffff" />
  </g>

  <!-- Typography Block -->
  <text x="600" y="380" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="0.14em">NEXUS</text>
  <text x="600" y="420" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="0.28em">AGENTIC BUSINESS INTELLIGENCE PLATFORM</text>

  <!-- Tagline -->
  <text x="600" y="475" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" font-style="italic" fill="#38bdf8">"Where Business Data Becomes Intelligence."</text>

  <!-- Bottom Badges / Metrics Bar -->
  <g transform="translate(240, 535)">
    <!-- Badge 1 -->
    <rect width="210" height="34" rx="17" fill="#0b172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="105" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">DETERMINISTIC SQL + RAG</text>

    <!-- Badge 2 -->
    <rect x="240" width="230" height="34" rx="17" fill="#0b172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="355" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">LANGGRAPH ORCHESTRATION</text>

    <!-- Badge 3 -->
    <rect x="500" width="220" height="34" rx="17" fill="#0b172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="610" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">AUDITABLE EVIDENCE PROOF</text>
  </g>
</svg>
