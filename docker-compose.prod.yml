# ==============================================================================
# NEXUS — Production Docker Compose Configuration
#
# Launches hardened, isolated production containers:
#   1. PostgreSQL 16 with pgvector extension & persistent volume
#   2. Redis 7 with AOF persistence & noeviction policy
#   3. FastAPI backend (production multi-stage image, non-root user, 2 workers)
#   4. Dedicated Continuous Intelligence Scheduler worker (isolated, health-monitored)
#   5. React SPA served via Nginx with reverse proxying and gzip
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector Database
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres_prod
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    volumes:
      - nexus_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-prod-network

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache & Shared Security State Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexus_redis_prod
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 64M
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - nexus_redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexus-prod-network

  # ----------------------------------------------------------------------------
  # NEXUS FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: nexus_backend_prod
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@postgres:5432/${POSTGRES_DB:-nexus_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_FAIL_CLOSED=${REDIS_FAIL_CLOSED:-true}
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      - SECRET_KEY=${SECRET_KEY:-nexus-production-secret-key-change-me}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-nexus-saas-jwt-secret-key-change-in-production-min-32-chars}
      - API_KEY_ENABLED=${API_KEY_ENABLED:-false}
      - API_KEY=${API_KEY:-}
      - CONTINUOUS_SCHEDULER_AUTOSTART=false
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - DATA_UPLOAD_MAX_MEMORY_SIZE_MB=${DATA_UPLOAD_MAX_MEMORY_SIZE_MB:-50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - nexus_backend_data:/app/data
    networks:
      - nexus-prod-network

  # ----------------------------------------------------------------------------
  # NEXUS Continuous Intelligence Scheduler Worker Process
  # ----------------------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: nexus_scheduler_prod
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    command: ["python", "-m", "app.scheduler_runner"]
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@postgres:5432/${POSTGRES_DB:-nexus_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_FAIL_CLOSED=${REDIS_FAIL_CLOSED:-true}
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONTINUOUS_SCHEDULER_ENABLED=true
      - CONTINUOUS_SCHEDULER_AUTOSTART=true
      - CONTINUOUS_SCHEDULER_INTERVAL_SECONDS=${CONTINUOUS_SCHEDULER_INTERVAL_SECONDS:-300}
      - SECRET_KEY=${SECRET_KEY:-nexus-production-secret-key-change-me}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-nexus-saas-jwt-secret-key-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.scheduler_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - nexus_backend_data:/app/data
    networks:
      - nexus-prod-network

  # ----------------------------------------------------------------------------
  # NEXUS Frontend Service (React SPA via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: nexus_frontend_prod
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nexus-prod-network

volumes:
  nexus_postgres_prod_data:
    name: nexus_postgres_prod_data
    driver: local
  # Phase 31B: Persistent tenant-file volume shared by backend and background worker/scheduler
  nexus_backend_data:
    name: nexus_backend_data
    driver: local
  # Phase 31B: Persistent Redis AOF volume for token revocation and rate limits
  nexus_redis_prod_data:
    name: nexus_redis_prod_data
    driver: local

networks:
  nexus-prod-network:
    name: nexus-prod-network
    driver: bridge
